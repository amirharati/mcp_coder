<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mcp-coder — delegation log</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --ok: #3ecf8e;
      --fail: #f87171;
      --accent: #6eb6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.1rem; font-weight: 600; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .toolbar label { font-size: 0.85rem; color: var(--muted); }
    input[type="text"], input[type="file"], select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input[type="text"] { min-width: 280px; flex: 1; }
    button {
      background: var(--accent);
      color: #0a0f14;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .stats {
      display: flex;
      gap: 1rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stats strong { color: var(--text); }
    main { padding: 1rem 1.25rem 2rem; max-width: 960px; margin: 0 auto; }
    .empty { color: var(--muted); padding: 2rem; text-align: center; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.75rem;
      overflow: hidden;
    }
    .card-head {
      padding: 0.85rem 1rem;
      cursor: pointer;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: start;
    }
    .card-head:hover { background: rgba(110, 182, 255, 0.06); }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }
    .badge.ok { background: rgba(62, 207, 142, 0.2); color: var(--ok); }
    .badge.fail { background: rgba(248, 113, 113, 0.2); color: var(--fail); }
    .meta { font-size: 0.8rem; color: var(--muted); }
    .task { font-size: 0.9rem; margin-top: 0.25rem; }
    .card-body {
      display: none;
      padding: 0 1rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .card.open .card-body { display: block; }
    .section { margin-top: 0.75rem; }
    .section h3 {
      margin: 0 0 0.35rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
    }
    .chip button {
      margin-left: 0.35rem;
      padding: 0.1rem 0.35rem;
      font-size: 0.7rem;
      vertical-align: middle;
    }
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.65rem;
      border-radius: 6px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.78rem;
      margin: 0;
    }
    .source-tag {
      display: inline-block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .ref-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.45rem;
    }
    .ref-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
    .loading { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>mcp-coder delegation log</h1>
    <div class="toolbar">
      <label>
        JSONL file
        <input type="file" id="fileInput" accept=".jsonl,.json,text/plain" />
      </label>
      <span id="serverMode" hidden>
        <span class="path-line" id="serverPath"></span>
        <button type="button" class="secondary" id="reloadBtn">Reload</button>
      </span>
      <input type="text" id="search" placeholder="Search id, task, files, error…" />
      <select id="filter">
        <option value="all">All</option>
        <option value="ok">Success only</option>
        <option value="fail">Failed only</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <div id="list" class="empty">Load a delegations.jsonl file, or run <code>mcp-coder view delegations</code> from your project directory</div>
  </main>

  <script>
    let records = [];
    let sourcePath = "";
    let serverMode = false;
    const enrichCache = new Map();

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s ?? "";
      return d.innerHTML;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).catch(() => {});
    }

    function fullPath(workspace, rel) {
      if (!rel) return "";
      if (!workspace) return rel;
      const sep = workspace.endsWith("/") ? "" : "/";
      return workspace + sep + rel;
    }

    function formatOutputLocal(r) {
      const response = r.response_to_cursor || {};
      if (r.error) return { text: r.error, source: "error" };
      if (response.output) return { text: response.output, source: "legacy_jsonl" };
      if (response.output_preview) {
        const bits = [response.output_preview];
        if (response.output_sha256) bits.push(`sha256: ${response.output_sha256}`);
        if (response.output_bytes != null) bits.push(`${response.output_bytes} bytes`);
        return { text: bits.join("\n"), source: "digest_preview" };
      }
      return { text: "—", source: "none" };
    }

    function sourceLabel(source) {
      const labels = {
        legacy_jsonl: "full output (legacy JSONL)",
        digest_preview: "digest preview (lean JSONL)",
        trace_executor: "executor trace file",
        trace_any_role: "trace file",
        error: "error",
        inline_jsonl: "inline (legacy JSONL)",
        "delegation_rag.db": "delegation_rag.db",
        "workspace_rag.db": "workspace_rag.db",
        unresolved: "unresolved pointer",
        none: "not available",
      };
      return labels[source] || source;
    }

    function renderContextRefs(refs) {
      if (!refs || !refs.length) return "<div class='meta'>—</div>";
      return refs
        .map((ref) => {
          const pointer = ref.pointer || ref;
          const title = `${pointer.kind || "?"} · ${pointer.id || "?"} · score ${pointer.score ?? "?"}`;
          const snippet = ref.snippet ? `<pre>${esc(ref.snippet)}</pre>` : "";
          const err = ref.error ? `<div class='meta'>${esc(ref.error)}</div>` : "";
          const meta = ref.metadata && Object.keys(ref.metadata).length
            ? `<div class='ref-meta'>${esc(JSON.stringify(ref.metadata))}</div>`
            : "";
          return `<div class='ref-card'><div class='ref-meta'><strong>${esc(title)}</strong> · ${esc(sourceLabel(ref.source || "inline_jsonl"))}</div>${meta}${snippet}${err}</div>`;
        })
        .join("");
    }

    function renderTrace(trace) {
      if (!trace || !trace.found) {
        return `<div class='meta'>${trace && trace.trace_ref ? esc(trace.trace_ref) + " (not found on disk)" : "—"}</div>`;
      }
      const head = `<div class='path-line'>${esc(trace.path || trace.trace_ref || "")}</div>`;
      const calls = (trace.llm_calls || [])
        .map((c) => {
          const bits = [
            `${c.role || "?"} · ${c.model || "?"}`,
            c.tokens ? `tokens ${JSON.stringify(c.tokens)}` : null,
            c.duration_ms != null ? `${c.duration_ms}ms` : null,
          ].filter(Boolean);
          const preview = c.response_preview ? `<pre>${esc(c.response_preview)}</pre>` : "";
          return `<div class='ref-card'><div class='ref-meta'>${esc(bits.join(" · "))}</div>${preview}</div>`;
        })
        .join("");
      return head + (calls || "<div class='meta'>no llm_call lines</div>");
    }

    function renderStorageLinks(links) {
      if (!links) return "—";
      const rows = [
        ["trace_ref", links.trace_ref],
        ["context_package_hash", links.context_package_hash],
        ["workspace_snapshot_db", links.workspace_snapshot_db],
        ["delegation_rag.db", links.delegation_rag_db],
        ["workspace_rag.db", links.workspace_rag_db],
      ].filter(([, v]) => v);
      if (!rows.length) return "—";
      return rows
        .map(([k, v]) => `<div><span class='meta'>${esc(k)}</span><div class='path-line'>${esc(v)}</div></div>`)
        .join("");
    }

    function renderDiffSummary(diff) {
      if (!diff) return "—";
      const created = (diff.created || []).length;
      const modified = (diff.modified || []).length;
      const deleted = (diff.deleted || []).length;
      return `<div class='meta'>${created} created · ${modified} modified · ${deleted} deleted</div>`;
    }

    async function fetchEnrichment(record) {
      const key = record.delegation_id || JSON.stringify(record).slice(0, 80);
      if (enrichCache.has(key)) return enrichCache.get(key);
      if (!serverMode) return null;
      const res = await fetch("/api/delegation/enrich", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record),
      });
      const payload = await res.json();
      if (!res.ok) throw new Error(payload.error || res.statusText);
      enrichCache.set(key, payload);
      return payload;
    }

    function applyEnrichment(card, record, enriched) {
      const output = enriched?.output || formatOutputLocal(record);
      const outEl = card.querySelector("[data-output]");
      const outSrc = card.querySelector("[data-output-source]");
      if (outEl) outEl.textContent = output.text || "—";
      if (outSrc) outSrc.textContent = sourceLabel(output.source);

      const refsEl = card.querySelector("[data-context-refs]");
      if (refsEl) {
        const refs = enriched?.context_refs_resolved?.length
          ? enriched.context_refs_resolved
          : (record.context_refs || []).map((pointer) => ({
              pointer,
              source: pointer.snippet ? "inline_jsonl" : "unresolved",
              snippet: pointer.snippet,
              metadata: pointer.metadata || {},
            }));
        refsEl.innerHTML = renderContextRefs(refs);
      }

      const traceEl = card.querySelector("[data-trace]");
      if (traceEl) traceEl.innerHTML = renderTrace(enriched?.trace || { trace_ref: record.trace_ref, found: false });

      const linksEl = card.querySelector("[data-storage-links]");
      if (linksEl) linksEl.innerHTML = renderStorageLinks(enriched?.storage_links);

      const diffEl = card.querySelector("[data-diff-summary]");
      if (diffEl) diffEl.innerHTML = renderDiffSummary(enriched?.delegation_diff);
    }

    async function onCardOpen(card, record) {
      if (!serverMode) {
        applyEnrichment(card, record, null);
        return;
      }
      const status = card.querySelector("[data-enrich-status]");
      if (status) status.textContent = "Resolving pointers from DBs and trace files…";
      try {
        const enriched = await fetchEnrichment(record);
        applyEnrichment(card, record, enriched);
        if (status) status.textContent = "";
      } catch (err) {
        applyEnrichment(card, record, null);
        if (status) status.textContent = `Enrichment failed: ${err.message}`;
      }
    }

    function renderStats(data) {
      const ok = data.filter((r) => r.success).length;
      const fail = data.length - ok;
      document.getElementById("stats").innerHTML =
        `<span><strong>${data.length}</strong> delegations</span>` +
        `<span><strong class="ok">${ok}</strong> ok</span>` +
        `<span><strong class="fail">${fail}</strong> failed</span>` +
        (sourcePath ? `<span class="path-line">${esc(sourcePath)}</span>` : "");
    }

    function filtered() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const f = document.getElementById("filter").value;
      return records.filter((r) => {
        if (f === "ok" && !r.success) return false;
        if (f === "fail" && r.success) return false;
        if (!q) return true;
        const blob = JSON.stringify(r).toLowerCase();
        return blob.includes(q);
      });
    }

    function toggleCard(card, idx) {
      const opening = !card.classList.contains("open");
      card.classList.toggle("open");
      if (opening) {
        const record = filtered()[idx];
        if (record) onCardOpen(card, record);
      }
    }

    function renderList() {
      const data = filtered();
      const list = document.getElementById("list");
      if (!data.length) {
        list.innerHTML = '<div class="empty">No matching delegations</div>';
        return;
      }
      list.innerHTML = data
        .map((r, i) => {
          const id = r.delegation_id || "?";
          const short = id.slice(0, 8);
          const task =
            (r.mcp_request && r.mcp_request.task) ||
            (r.context && r.context.prompt_preview) ||
            "";
          const ws = r.workspace_path || "";
          const files = (r.files_changed || []).concat(r.files_requested || []);
          const uniq = [...new Set(files)];
          const chips = uniq
            .slice(0, 8)
            .map((f) => {
              const abs = fullPath(ws, f);
              return `<span class="chip">${esc(f)}<button type="button" class="secondary" data-copy="${esc(abs)}">copy path</button></span>`;
            })
            .join("");
          const timing = r.timing
            ? `engine ${r.timing.engine_run_ms ?? "?"}ms · total ${r.duration_ms ?? "?"}ms`
            : `${r.duration_ms ?? "?"}ms`;
          return `
          <article class="card" data-idx="${i}" data-delegation-id="${esc(id)}">
            <div class="card-head" onclick="toggleCard(this.parentElement, ${i})">
              <span class="badge ${r.success ? "ok" : "fail"}">${r.success ? "ok" : "fail"}</span>
              <div>
                <div><strong>${esc(short)}…</strong> · ${esc(r.model || "?")} · ${esc(timing)}</div>
                <div class="meta">${esc(r.timestamp_start || "")}</div>
                <div class="task">${esc(task.slice(0, 160))}${task.length > 160 ? "…" : ""}</div>
              </div>
              <div class="meta">${(r.files_changed || []).length} changed</div>
            </div>
            <div class="card-body">
              <div class="section">
                <h3>Workspace</h3>
                <div class="path-line">${esc(ws)}</div>
                <button type="button" class="secondary" data-copy="${esc(ws)}">Copy workspace</button>
              </div>
              <div class="section"><h3>Files</h3><div class="chips">${chips || "—"}</div></div>
              <div class="section"><h3>Context preview</h3><pre>${esc((r.context && r.context.prompt_preview) || "—")}</pre></div>
              <div class="section">
                <h3>Output / error</h3>
                <div class="source-tag" data-output-source>${esc(sourceLabel(formatOutputLocal(r).source))}</div>
                <pre data-output>${esc(formatOutputLocal(r).text)}</pre>
                <div class="meta loading" data-enrich-status></div>
              </div>
              <div class="section"><h3>Context refs</h3><div data-context-refs class="meta loading">Expand to resolve…</div></div>
              <div class="section"><h3>Trace file</h3><div data-trace class="meta loading">Expand to load…</div></div>
              <div class="section"><h3>Workspace diff</h3><div data-diff-summary class="meta loading">Expand to load…</div></div>
              <div class="section"><h3>Storage links</h3><div data-storage-links class="meta loading">Expand to load…</div></div>
              <div class="section"><h3>Full record</h3><pre>${esc(JSON.stringify(r, null, 2))}</pre></div>
            </div>
          </article>`;
        })
        .join("");
      list.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          copyText(btn.getAttribute("data-copy"));
        });
      });
    }

    function loadRecords(data, path) {
      records = data;
      sourcePath = path || "";
      enrichCache.clear();
      renderStats(records);
      renderList();
    }

    async function loadFromServer() {
      const res = await fetch("/api/delegations");
      const payload = await res.json();
      if (!res.ok) throw new Error(payload.error || res.statusText);
      serverMode = true;
      document.getElementById("serverMode").hidden = false;
      document.getElementById("fileInput").closest("label").hidden = true;
      document.getElementById("serverPath").textContent = payload.path;
      loadRecords(payload.records, payload.path);
    }

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      serverMode = false;
      const text = await file.text();
      const lines = text.split("\n").filter((l) => l.trim());
      const parsed = lines.map((l) => JSON.parse(l)).reverse();
      loadRecords(parsed, file.name);
    });

    document.getElementById("search").addEventListener("input", renderList);
    document.getElementById("filter").addEventListener("change", renderList);
    document.getElementById("reloadBtn")?.addEventListener("click", () => loadFromServer().catch(alert));

    loadFromServer().catch(() => {
      /* standalone: use file picker */
    });
  </script>
</body>
</html>
