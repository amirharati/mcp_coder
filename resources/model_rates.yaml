# Static model pricing for usage telemetry (cost_est_usd).
#
# Coverage: partial — only models we use in dev today. Unknown models log
# cost_est_usd.source = "unknown_model" (delegation still succeeds).
#
# Maintenance: add a row when you switch AIDER_MODEL / OpenRouter ids; keys
# must match Aider model strings (e.g. openrouter/openai/gpt-4o-mini).
# Prices are approximate USD per 1M tokens — verify against OpenRouter when
# rates change.
#
# Future (not implemented): refresh from OpenRouter pricing API, provider
# docs, or a small scraper; optional workspace override file. Until then,
# this file is the source of truth.
#
models:
  openrouter/openai/gpt-4o-mini:
    input_per_million: 0.15
    output_per_million: 0.60
  openrouter/openai/gpt-4o:
    input_per_million: 2.50
    output_per_million: 10.00
  openrouter/anthropic/claude-sonnet-4:
    input_per_million: 3.0
    output_per_million: 15.0
