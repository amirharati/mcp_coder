# One managed rule in the workspace per policy (dest filename always use-mcp-coder.mdc).
# Source files may use <!-- @include filename --> directives; compiled at sync time.
# Files listed under `includes` are source-only and are never synced to workspaces.
version: 2
default_policy: default

includes:
  - use-mcp-coder.shared.md

policies:
  default:
    rules:
      - dest: use-mcp-coder.mdc
        src: use-mcp-coder.default.mdc
      - dest: workspace-history.mdc
        src: workspace-history.mdc
  strict:
    rules:
      - dest: use-mcp-coder.mdc
        src: use-mcp-coder.strict.mdc
      - dest: workspace-history.mdc
        src: workspace-history.mdc
