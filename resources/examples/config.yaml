# Example workspace config — copy to <workspace>/.mcp-coder/config.yaml
# User-owned; mcp-coder reads only (never auto-copied or overwritten).

# Session policy: always_new | align_host
session_policy: always_new

# Reuse mcp session per Cursor chat:
# session_policy: align_host

# Host transcript injection (default: none — summary+task only)
# host_transcript: none
# host_transcript: dump   # prepend full Cursor chat JSONL (dump-all)

# Cursor rules — one managed file synced on MCP restart: .cursor/rules/use-mcp-coder.mdc
# cursor_rules_policy: default   # default | strict (content swap) — then restart MCP
# cursor_rules:
#   sync: false

# Server audit log (optional; overrides MCP_CODER_SERVER_LOG_* env)
# server_log: on
# server_log_level: info
# server_log_scope: global

# Echo usage block in delegate_to_agent response (JSONL always logs usage)
# usage_report: true

# Auto-merge spec Files: Read into effective target_files on implement (default: on)
# auto_merge_spec_read: false

# Delegation keyword search index (rag_search MCP + post-delegate upsert; default: on)
# rag_enabled: false

# Review model for mode=review (overrides MCP_CODER_REVIEW_MODEL when both set)
# review_model: openrouter/anthropic/claude-sonnet-4

# Context builder: rules-based file picker + repo map before implement delegations
# (default: on; env MCP_CODER_CONTEXT_BUILDER_ENABLED=0 also disables)
# context_builder: false

# Cheap-LLM context brief on top of the picker (default: on after Phase 4 dogfood;
# requires context_builder on; env MCP_CODER_CONTEXT_BUILDER_LLM=0 also disables).
# Model via context_builder_model / MCP_CODER_CONTEXT_BUILDER_MODEL (set in server .env).
# context_builder_llm: false   # uncomment to disable

# Post-delegate verify (opt-in; runs after successful implement with files_changed)
# auto_verify: true
# verify_command: "pytest -q"
# verify_timeout_s: 120
